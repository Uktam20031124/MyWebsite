name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 — eng past qo'llab-quvvatlanadigan versiya (Ubuntu 22.04 server).
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - name: Production sozlamalari
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-not-secret-0123456789-abcdefghijklmnopqrstuvwxyz
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py collectstatic --noinput
