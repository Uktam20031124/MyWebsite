<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish · Darsxona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <p class="kicker">Faqat ustoz uchun</p>
      <h1 class="display">Darsxona</h1>
      <p class="meta" style="margin-bottom:22px">Guruhlar, mavzular, dars va yo‘qlama — bitta daftar.</p>
      <form method="post">
        {% csrf_token %}
        {% if locked_message %}
          <ul class="errorlist nonfield" role="alert"><li>{{ locked_message }}</li></ul>
        {% elif form.non_field_errors %}
          <div role="alert">{{ form.non_field_errors }}</div>
        {% endif %}
        <div class="field">
          <label for="{{ form.username.id_for_label }}">Login</label>
          {{ form.username }}
        </div>
        <div class="field">
          <label for="{{ form.password.id_for_label }}">Parol</label>
          {{ form.password }}
        </div>
        <button class="btn" type="submit" style="width:100%">Kirish</button>
      </form>
    </div>
  </div>
</body>
</html>
