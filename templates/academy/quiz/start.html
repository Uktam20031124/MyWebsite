{% extends "academy/quiz/public_base.html" %}
{% block panel %}
<h1>{{ t.topic }}</h1>
<p class="muted">{{ t.hello }}, <strong class="strong">{{ attempt.student.full_name }}</strong>!</p>
<ul class="rules">
  <li>{{ t.rule_questions }}</li>
  <li>{{ t.rule_time|safe }}</li>
  <li>{{ t.rule_once|safe }}</li>
  <li>{{ t.rule_leave|safe }}</li>
</ul>
<form method="post">
  {% csrf_token %}
  <button class="btn primary block" type="submit">{{ t.start }}</button>
</form>
{% endblock %}
