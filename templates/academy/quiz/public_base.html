<!doctype html>
<html lang="{{ t.lang|default:'uz' }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#10244c">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Test · {{ t.topic }}{% endblock %}</title>
  <meta property="og:title" content="Test: {{ t.topic }}">
  <meta property="og:description" content="{{ t.kicker }}">
  {% include "academy/includes/head.html" %}
</head>
<body class="quiz-body">
  {% block body %}
  <main class="quiz-shell">
    <div class="card pad quiz-panel">
      <p class="kicker">{{ t.kicker }}</p>
      {% block panel %}{% endblock %}
    </div>
  </main>
  {% endblock %}
</body>
</html>
