{% load i18n %}{% get_current_language as LANG %}<form class="lang-switch" method="post" action="{% if request.portal_lang_url %}{{ request.portal_lang_url }}{% else %}{% url 'set_language' %}{% endif %}" aria-label="{% translate "Til" %}">
  {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="uz"{% if LANG == "uz" %} aria-pressed="true"{% endif %}>UZ</button><span aria-hidden="true">|</span><button type="submit" name="language" value="ru"{% if LANG == "ru" %} aria-pressed="true"{% endif %}>RU</button>
</form>
