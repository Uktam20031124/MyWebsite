{% if is_paginated %}
  <nav class="pager" aria-label="Sahifalar">
    {% if page_obj.has_previous %}<a class="btn quiet" href="{% querystring page=page_obj.previous_page_number %}">← Oldingi</a>{% endif %}
    <span class="meta">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }} · jami {{ page_obj.paginator.count }}</span>
    {% if page_obj.has_next %}<a class="btn quiet" href="{% querystring page=page_obj.next_page_number %}">Keyingi →</a>{% endif %}
  </nav>
{% endif %}
