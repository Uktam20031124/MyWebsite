<!doctype html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#15251e">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ student.full_name }} · profil{% endblock %}</title>
  {% include "academy/includes/head.html" %}
</head>
<body class="quiz-body">
<main class="portal">
  {% if messages %}<div class="portal-messages">{% for m in messages %}<div class="callout {% if m.level_tag == 'error' %}warn{% else %}next{% endif %}" role="status"><div class="grow">{{ m }}</div></div>{% endfor %}</div>{% endif %}
  {% block main %}{% endblock %}
</main>
</body>
</html>
