[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["academy/migrations"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, django
select = ["F", "E", "W", "I", "B", "UP", "DJ"]
ignore = [
    "DJ001",  # TextField/CharField(blank=True) — bo'sh satr ataylab ishlatiladi
    "DJ012",  # model metodlari tartibi — faqat uslub
]
